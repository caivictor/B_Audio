<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebCaptioner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 260px;
      padding: 16px;
      margin: 0;
      background-color: #1e1e2e;
      color: #cdd6f4;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      color: #cba6f7;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .checkbox-group {
      margin-bottom: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cdd6f4;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #89b4fa;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #a6adc8;
    }

    select, input[type="text"], button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background-color: #313244;
      color: #cdd6f4;
      font-size: 14px;
      box-sizing: border-box;
    }

    select:focus, input[type="text"]:focus, button:focus {
      outline: none;
      border-color: #cba6f7;
    }

    button {
      margin-top: 8px;
      background-color: #89b4fa;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #b4befe;
    }

    button.active {
      background-color: #f38ba8;
      color: #11111b;
    }

    button.secondary {
      background-color: #45475a;
      color: #cdd6f4;
    }

    button.secondary:hover {
      background-color: #585b70;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      color: #a6adc8;
    }

    .status.connected {
      color: #a6e3a1;
    }
  </style>
</head>
<body>
  <h2>WebCaptioner</h2>
  <div class="form-group">
    <label for="languageSelect">Source Language</label>
    <select id="languageSelect">
      <option value="es" selected>Spanish (es)</option>
      <option value="en">English (en)</option>
      <option value="fr">French (fr)</option>
      <option value="de">German (de)</option>
      <option value="it">Italian (it)</option>
      <option value="pt">Portuguese (pt)</option>
      <option value="ja">Japanese (ja)</option>
      <option value="zh">Chinese (zh)</option>
      <option value="ru">Russian (ru)</option>
      <option value="ko">Korean (ko)</option>
    </select>
  </div>
  <div class="form-group">
    <label for="fontSizeSelect">Caption Font Size</label>
    <select id="fontSizeSelect">
      <option value="16">16 px (Small)</option>
      <option value="20">20 px (Medium)</option>
      <option value="24" selected>24 px (Default)</option>
      <option value="28">28 px (Large)</option>
      <option value="32">32 px (Extra Large)</option>
      <option value="36">36 px (Huge)</option>
    </select>
  </div>
  <div class="form-group">
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" value="ws://192.168.0.30:8000/transcribe" placeholder="ws://localhost:8000/transcribe">
  </div>
  <div class="form-group checkbox-group">
    <label for="translateCheckbox" class="checkbox-label">
      <input type="checkbox" id="translateCheckbox">
      <span>Translate to English</span>
    </label>
  </div>
  <button id="toggleBtn">Start Captioning</button>
  <button id="downloadBtn" class="secondary">Download Transcript</button>
  <div id="status" class="status">Status: Idle</div>

  <script src="popup.js"></script>
</body>
</html>
